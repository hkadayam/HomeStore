[workspace]
resolver = "2"
members = [
    "src/sisl",
    "src/homestore",
    "src/iomanager",
    "src/iomanager/macros",
    "src/homedb/core",
    "src/homedb/mem_db",
    "src/homedb/mem_db_macros",
]

[workspace.dependencies]
crossbeam = "0.8"

[workspace.package]
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
