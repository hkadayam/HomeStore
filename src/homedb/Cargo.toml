[package]
name = "homedb"
version = "0.1.0"
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"
description = "Unified database API supporting sync/async and in-memory/persistent modes"

[dependencies]
homestore = { path = "../homestore", default-features = false, features = ["btree-only"] }
maybe-async-cfg = "0.2"
mem_db_macros = { path = "mem_db_macros" }
parking_lot = "0.12"
dashmap = "6.0"
async-trait = "0.1"
tokio = { version = "1.35", features = ["sync", "rt"], optional = true }
iomgr = { path = "../iomanager", optional = true }

[dev-dependencies]
rand = "0.8"
tokio = { version = "1.35", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[features]
default = ["persistent"]

# Storage mode features
persistent = ["homestore/persistent", "dep:iomgr", "dep:tokio"]
inmem      = ["homestore/inmem"]

# Top-level compilation modes — specify exactly one.
sync_code          = ["sync_frontend", "sync_backend"]
async_code         = ["async_frontend", "async_backend", "dep:iomgr", "dep:tokio"]
sync_over_async_code = ["sync_frontend", "async_backend", "dep:iomgr", "dep:tokio"]

# Orthogonal sub-flags used in .rs source code.
sync_frontend  = []
async_frontend = []
sync_backend   = ["homestore/sync_code"]
async_backend  = ["homestore/async_code", "dep:iomgr", "dep:tokio"]

# Note: Lock type (async vs sync) is controlled by sync_code vs async_code/sync_over_async.
# Router (in homedb/common) is the only place that branches on direct call vs spawn.

[lib]
name = "homedb"
path = "src/lib.rs"
