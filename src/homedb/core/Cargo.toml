[package]
name = "homedb_core"
version = "0.1.0"
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"
description = "Core foundational layer for HomeDB (btree backends, MVCC, key types)"

[dependencies]
homestore = { path = "../../homestore", default-features = false, features = ["btree-only"] }
iomgr = { path = "../../iomanager", features = ["tokio"], optional = true }
tokio = { version = "1.35", features = ["sync", "rt", "time"], optional = true }
crossbeam-queue = "0.3"
arc-swap = "1"
maybe-async-cfg = "0.2"
async-trait = { version = "0.1", optional = true }
cfg-if = "1"
parking_lot = "0.12"
crossbeam-skiplist = "0.1"
smallvec = "1"

[features]
default = []
# sync_frontend/async_frontend: API surface (sync fn vs async fn).
# sync_backend/async_backend: execution engine (homestore sync_code vs async_code).
# Bridge to homestore: sync_backend -> homestore/sync_code; async_backend -> homestore/async_code.
sync_frontend = []
async_frontend = ["dep:async-trait"]
sync_backend  = ["homestore/sync_code"]
async_backend = ["homestore/async_code", "dep:iomgr", "dep:tokio"]
