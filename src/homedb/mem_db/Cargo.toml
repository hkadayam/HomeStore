[package]
name = "mem_db"
version = "0.1.0"
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"
description = "In-memory database built on Homestore Btree"

[dependencies]
homestore = { path = "../../homestore", default-features = false, features = ["btree-only", "inmem"] }
homedb_core = { path = "../core", default-features = false }
tokio = { version = "1.35", features = ["full"], optional = true }
iomgr = { path = "../../iomanager", optional = true }
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6.0"
maybe-async-cfg = "0.2"
cfg-if = "1"
mem_db_macros = { path = "../mem_db_macros" }

[dev-dependencies]
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
# Note: iomgr and tokio are only needed for async_mode tests, but Cargo requires
# all dev-dependencies for any test build. When building just the library without
# tests, these are not included.
iomgr = { path = "../../iomanager", features = ["tokio", "test-mode"] }
tokio = { version = "1.35", features = ["full"] }

[lib]
name = "mem_db"
path = "src/lib.rs"

[features]
default = []
# Top-level compilation modes — specify exactly one.
sync_code          = ["sync_frontend", "sync_backend",
                      "homedb_core/sync_frontend", "homedb_core/sync_backend"]
async_code         = ["async_frontend", "async_backend", "dep:iomgr", "dep:tokio",
                      "homedb_core/async_frontend", "homedb_core/async_backend"]
sync_over_async_code = ["sync_frontend", "async_backend", "dep:iomgr", "dep:tokio",
                         "homedb_core/sync_frontend", "homedb_core/async_backend"]
# Orthogonal sub-flags used directly in .rs source code.
# sync_frontend/async_frontend: API surface. sync_backend/async_backend: execution engine.
sync_frontend  = []
async_frontend = []
sync_backend   = []
async_backend  = ["dep:iomgr", "dep:tokio"]

[[bench]]
name = "bench_memdb_vs_rocksdb"
harness = false

[[test]]
name = "memdb_bench"
path = "tests/memdb_bench.rs"
harness = false
