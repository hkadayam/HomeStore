[package]
name = "homestore"
version = "0.1.0"
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"
description = "Rust implementation of HomeStore device management"
readme = "README.md"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
libc = "0.2"
once_cell = "1.19"
sisl = { path = "../sisl" }
aligned-vec = "0.6"
uuid = { version = "1.18.1", features = ["v4"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
iomgr = { path = "../iomanager", optional = true }
maybe-async-cfg = "0.2"
parking_lot = "0.12"
crossbeam = { workspace = true }
async-trait = "0.1"
smallvec = "1.15.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
arc-swap = "1.6"
dashmap = "6.0"
futures = "0.3"
crc = "3.0"
triomphe = "0.1"
bitfield = "0.14"
bytemuck = { version = "1.14", features = ["derive"] }

# io_uring is only available on Linux
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4"

[dev-dependencies]
tokio-test = "0.4"
paste = "1.0"
rand = "0.8"
iomgr = { path = "../iomanager", features = ["tokio", "test-mode"] }

[lib]
name = "homestore"
path = "lib.rs"

[features]
# New unified feature flags for sync/async + inmem/persistent modes
default = ["persistent", "btree-only", "async_code"]
persistent = ["dep:iomgr"]  # Persistent mode requires iomanager (async runtime)
inmem = []  # In-memory mode (btree only, no device layer)
sync_code = []  # Sync mode (strips async/await, uses sync locks)
async_code = ["dep:iomgr"]  # Async mode (uses async locks and iomanager)

# Legacy features (backward compatibility)
full = ["device", "checkpoint", "blkalloc", "blob", "streams", "cow_btree"]
btree-only = []  # Just index/btree modules, no device layer
device = ["persistent"]  # Device layer requires iomanager
checkpoint = ["persistent"]
blkalloc = ["persistent"]
blob = ["persistent"]
streams = ["persistent"]
cow_btree = ["device", "streams"]  # COW btree needs device layer

[[test]]
name = "btree_bench"
path = "tests/btree_bench.rs"
required-features = ["btree-only"]
harness = false  # Disable default test harness for benchmark-style output
