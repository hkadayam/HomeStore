[package]
name = "homestore"
version = "0.1.0"
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"
description = "Rust implementation of HomeStore device management"
readme = "README.md"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
libc = "0.2"
once_cell = "1.19"
sisl = { path = "../sisl" }
aligned-vec = "0.6"
uuid = { version = "1.18.1", features = ["v4"] }
log = "0.4"
iomgr = { path = "../iomanager" }
parking_lot = "0.12"
crossbeam = { workspace = true }
async-trait = "0.1"
smallvec = "1.15.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
arc-swap = "1.6"
dashmap = "6.0"
futures = "0.3"
crc = "3.0"
triomphe = "0.1"

# io_uring is only available on Linux
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.4"

[dev-dependencies]
tokio-test = "0.4"
paste = "1.0"
rand = "0.8"

[lib]
name = "homestore"
path = "lib.rs"

[features]
default = ["full"]
full = ["device", "checkpoint", "blkalloc", "blob", "streams", "cow_btree"]
btree-only = []  # Just index/btree modules, no device layer
device = []
checkpoint = []
blkalloc = []
blob = []
streams = []
cow_btree = ["device", "streams"]  # COW btree needs device layer

[[test]]
name = "btree_node_tests"
path = "tests/btree_node_tests.rs"
required-features = ["btree-only"]
