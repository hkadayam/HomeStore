[package]
name = "iomgr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Harihara Kadayam"]
description = "Distributed async locks and reactor/IO manager abstraction with glommio or tokio backends"

[features]
default = ["tokio"]
glommio = ["dep:glommio"]
tokio = ["dep:tokio"]
test-mode = []  # Enable refcounted singleton for concurrent test support

[dependencies]
once_cell = "1.19"
log = "0.4"
crossbeam = "0.8"
glommio = { version = "0.8", optional = true }
tokio = { version = "1.35", features = ["sync","rt","rt-multi-thread","macros","fs","io-util","time"], optional = true }
aligned_box = { version = "0.3" }
iomanager_macros = { path = "macros" }
parking_lot = "0.12"  # For test-mode refcounted singleton

[lib]
name = "iomgr"
path = "src/lib.rs"