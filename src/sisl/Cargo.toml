[package]
name = "sisl"
version = "0.1.0"
edition = "2021"
authors = ["Harihara Kadayam"]
license = "Apache-2.0"
description = "Rust implementation of SISL bitset and bitword data structures"
repository = "https://github.com/hkadayam/sisl"
readme = "README.md"

[dependencies]
rand = "0.8"
bytes = "1.7"
aligned-vec = "0.6"
zerocopy = { version = "0.8", features = ["derive"] }
serde_json = "1.0"
crossbeam-epoch = "0.9"
left-right = "0.11"
iomgr = { path = "../iomanager" }
moka = { path = "../../../moka++", features = ["sync"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "sync"] }
# simd_aligned = "0.6"  # Optional: for high-performance SIMD scenarios

[dev-dependencies]
rand = { version = "0.8", features = ["std_rng"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "bitword_tests"
path = "tests/test_bitword.rs"

[[test]]
name = "bitset_tests"
path = "tests/test_bitset.rs"

[[bench]]
name = "bitset_bench"
path = "benches/bitset_bench.rs"
harness = false

[lib]
name = "sisl"
path = "src/lib.rs"